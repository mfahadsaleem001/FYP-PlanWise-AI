<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <script>
      (function () {
        const savedTheme =
          localStorage.getItem("planwise-admin-theme") || "light";

        let theme = savedTheme;

        if (savedTheme === "system") {
          theme = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
            ? "dark"
            : "light";
        }

        document.documentElement.setAttribute(
          "data-theme",
          theme
        );
      })();
    </script>

    <title>PlanWise AI</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
